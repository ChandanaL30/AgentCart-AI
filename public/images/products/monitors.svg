<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0c041c"/>
    </radialGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="dispGlow">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bgm)"/>
  <!-- Ambient screen glow -->
  <rect x="70" y="90" width="260" height="170" rx="12" fill="#8b5cf6" opacity="0.2" filter="url(#dispGlow)"/>
  <!-- Monitor Outer Frame -->
  <rect x="65" y="85" width="270" height="175" rx="10" fill="#0f172a" stroke="#334155" stroke-width="3"/>
  <!-- Screen Panel -->
  <rect x="72" y="92" width="256" height="161" rx="6" fill="url(#screen)"/>
  <path d="M72 190 Q150 140 220 180 T328 150 L328 253 L72 253 Z" fill="#ffffff" opacity="0.15"/>
  <!-- 4K Logo -->
  <rect x="275" y="105" width="40" height="18" rx="4" fill="#0f172a" opacity="0.8"/>
  <text x="282" y="118" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#f8fafc">4K IPS</text>
  <!-- Stand Neck -->
  <rect x="188" y="260" width="24" height="48" fill="#334155"/>
  <!-- Stand Base -->
  <ellipse cx="200" cy="312" rx="60" ry="10" fill="#1e293b" stroke="#475569" stroke-width="2"/>
</svg>