<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="band" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="cup" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="130" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>
  <path d="M110 210 C110 110, 290 110, 290 210" fill="none" stroke="url(#band)" stroke-width="18" stroke-linecap="round"/>
  <path d="M130 180 C130 130, 270 130, 270 180" fill="none" stroke="#4338ca" stroke-width="6" opacity="0.6"/>
  <!-- Left Ear Cup -->
  <rect x="90" y="195" width="42" height="75" rx="20" fill="url(#cup)"/>
  <rect x="100" y="202" width="22" height="61" rx="11" fill="#0f172a"/>
  <!-- Right Ear Cup -->
  <rect x="268" y="195" width="42" height="75" rx="20" fill="url(#cup)"/>
  <rect x="278" y="202" width="22" height="61" rx="11" fill="#0f172a"/>
  <!-- Decorative Soundwave -->
  <line x1="160" y1="230" x2="160" y2="245" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="175" y1="215" x2="175" y2="260" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="190" y1="205" x2="190" y2="270" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round"/>
  <line x1="205" y1="200" x2="205" y2="275" stroke="#c7d2fe" stroke-width="4" stroke-linecap="round"/>
  <line x1="220" y1="205" x2="220" y2="270" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round"/>
  <line x1="235" y1="215" x2="235" y2="260" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="250" y1="230" x2="250" y2="245" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
</svg>