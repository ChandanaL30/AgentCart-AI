<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bghub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#311042"/>
      <stop offset="100%" stop-color="#0d0314"/>
    </radialGradient>
    <linearGradient id="hubBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="hubGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bghub)"/>
  <circle cx="200" cy="200" r="120" fill="#a855f7" opacity="0.15" filter="url(#hubGlow)"/>
  <!-- Hub Body -->
  <rect x="90" y="140" width="220" height="120" rx="16" fill="url(#hubBody)" stroke="#c084fc" stroke-width="2"/>
  <rect x="105" y="155" width="190" height="90" rx="10" fill="#0f172a" opacity="0.6"/>
  <!-- Ports -->
  <!-- USB-C 1 -->
  <rect x="120" y="185" width="14" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="124" y="193" width="6" height="14" rx="2" fill="#0284c7"/>
  <!-- USB-C 2 -->
  <rect x="145" y="185" width="14" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="149" y="193" width="6" height="14" rx="2" fill="#0284c7"/>
  <!-- USB-A 1 -->
  <rect x="175" y="182" width="28" height="36" rx="4" fill="#020617" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="180" y="187" width="18" height="8" rx="2" fill="#38bdf8"/>
  <!-- USB-A 2 -->
  <rect x="215" y="182" width="28" height="36" rx="4" fill="#020617" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="220" y="187" width="18" height="8" rx="2" fill="#38bdf8"/>
  <!-- HDMI Port -->
  <path d="M255 186 L285 186 L280 214 L260 214 Z" fill="#020617" stroke="#e879f9" stroke-width="1.5"/>
  <!-- Power LED -->
  <circle cx="115" cy="168" r="3" fill="#4ade80" filter="url(#hubGlow)"/>
  <!-- Braided Cable attached -->
  <path d="M90 200 C50 200, 50 130, 90 100" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <path d="M90 100 L110 85" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
  <text x="145" y="295" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#e9d5ff" letter-spacing="2">MULTI-PORT DOCK</text>
  <text x="160" y="312" font-family="system-ui, sans-serif" font-weight="semibold" font-size="9" fill="#c084fc">100W POWER DELIVERY</text>
</svg>