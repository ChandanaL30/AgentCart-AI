<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgck" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#180400"/>
    </radialGradient>
    <linearGradient id="cookerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="cookerglow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bgck)"/>
  <circle cx="200" cy="200" r="120" fill="#f97316" opacity="0.12" filter="url(#cookerglow)"/>
  <!-- Pressure Valve / Handle -->
  <rect x="188" y="90" width="24" height="20" rx="5" fill="#f97316"/>
  <rect x="170" y="105" width="60" height="12" rx="4" fill="#334155"/>
  <!-- Lid -->
  <ellipse cx="200" cy="130" rx="100" ry="25" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <!-- Pot Body -->
  <rect x="105" y="138" width="190" height="145" rx="18" fill="url(#cookerGrad)" stroke="#64748b" stroke-width="2"/>
  <!-- Side Handles -->
  <rect x="80" y="170" width="25" height="35" rx="6" fill="#0f172a"/>
  <rect x="295" y="170" width="25" height="35" rx="6" fill="#0f172a"/>
  <!-- Digital Control Panel -->
  <rect x="150" y="165" width="100" height="90" rx="10" fill="#020617" stroke="#f97316" stroke-width="1.5"/>
  <rect x="165" y="178" width="70" height="25" rx="4" fill="#0f172a"/>
  <text x="180" y="196" font-family="monospace" font-weight="bold" font-size="14" fill="#fb923c">00:30</text>
  <circle cx="175" cy="225" r="6" fill="#f97316"/>
  <circle cx="200" cy="225" r="6" fill="#38bdf8"/>
  <circle cx="225" cy="225" r="6" fill="#10b981"/>
  <!-- Base feet -->
  <rect x="130" y="283" width="25" height="12" rx="3" fill="#0f172a"/>
  <rect x="245" y="283" width="25" height="12" rx="3" fill="#0f172a"/>
</svg>