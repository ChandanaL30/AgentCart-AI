<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgbt" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#021d1b"/>
    </radialGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="bottleglow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bgbt)"/>
  <circle cx="200" cy="200" r="120" fill="#2dd4bf" opacity="0.12" filter="url(#bottleglow)"/>
  <!-- Cap & Carry Loop -->
  <path d="M185 85 C185 70, 215 70, 215 85" fill="none" stroke="#2dd4bf" stroke-width="6" stroke-linecap="round"/>
  <rect x="175" y="88" width="50" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <rect x="182" y="114" width="36" height="16" fill="#334155"/>
  <!-- Flask Body -->
  <rect x="155" y="130" width="90" height="205" rx="20" fill="url(#steel)" stroke="#5eead4" stroke-width="2"/>
  <rect x="165" y="145" width="20" height="175" rx="8" fill="#ffffff" opacity="0.15"/>
  <text x="178" y="240" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#ccfbf1" letter-spacing="1">1000ml</text>
  <text x="170" y="254" font-family="system-ui, sans-serif" font-weight="semibold" font-size="8" fill="#a7f3d0">24H HOT/COLD</text>
</svg>